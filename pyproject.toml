[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dramatis"
version = "0.1.0.dev0"
description = "Character relationship graphs for narrative works, with snapshots across revisions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Kestora Labs" }]
keywords = ["narrative", "character-network", "digital-humanities", "graph"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/kestora-labs/dramatis"
Source = "https://github.com/kestora-labs/dramatis"

[tool.hatch.build.targets.wheel]
packages = ["src/dramatis"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
