<!-- Diagrams for the manual, kept in one file so they can be edited without hunting through
     the prose. Each is copied into manual.html inside a <figure>. -->

<!-- FIG: what Dramatis does ------------------------------------------------------------ -->
<svg id="fig-pipeline" viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- lane labels -->
  <text x="10" y="24" font-size="10" fill="#c05621" letter-spacing="1.2">ON YOUR MACHINE</text>

  <!-- boxes -->
  <g>
    <rect x="10" y="40" width="132" height="66" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
    <text x="76" y="66" text-anchor="middle" font-size="13" fill="#1a202c" font-weight="600">Your files</text>
    <text x="76" y="84" text-anchor="middle" font-size="10" fill="#718096">chapters, notes,</text>
    <text x="76" y="97" text-anchor="middle" font-size="10" fill="#718096">a cast list</text>
  </g>

  <line x1="146" y1="73" x2="176" y2="73" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g>
    <rect x="182" y="40" width="132" height="66" rx="6" fill="#edf2f7" stroke="#a0aec0"/>
    <text x="248" y="64" text-anchor="middle" font-size="13" fill="#1a202c" font-weight="600">Ingest</text>
    <text x="248" y="82" text-anchor="middle" font-size="10" fill="#718096">the text is copied in</text>
    <text x="248" y="95" text-anchor="middle" font-size="10" fill="#718096">and fingerprinted</text>
  </g>

  <line x1="318" y1="73" x2="348" y2="73" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g>
    <rect x="354" y="40" width="132" height="66" rx="6" fill="#fffaf5" stroke="#c05621"/>
    <text x="420" y="64" text-anchor="middle" font-size="13" fill="#1a202c" font-weight="600">Analyse</text>
    <text x="420" y="82" text-anchor="middle" font-size="10" fill="#c05621">the one step that</text>
    <text x="420" y="95" text-anchor="middle" font-size="10" fill="#c05621">calls a model</text>
  </g>

  <line x1="490" y1="73" x2="520" y2="73" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g>
    <rect x="526" y="40" width="132" height="66" rx="6" fill="#edf2f7" stroke="#a0aec0"/>
    <text x="592" y="64" text-anchor="middle" font-size="13" fill="#1a202c" font-weight="600">Snapshot</text>
    <text x="592" y="82" text-anchor="middle" font-size="10" fill="#718096">a graph, frozen,</text>
    <text x="592" y="95" text-anchor="middle" font-size="10" fill="#718096">never overwritten</text>
  </g>

  <!-- down to the project file -->
  <path d="M248 106 L248 150 L592 150 L592 106" fill="none" stroke="#a0aec0" stroke-width="1.2"
        stroke-dasharray="3 3"/>
  <line x1="420" y1="150" x2="420" y2="176" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g>
    <rect x="284" y="182" width="272" height="54" rx="6" fill="#1a202c"/>
    <text x="420" y="205" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">
      One project file
    </text>
    <text x="420" y="223" text-anchor="middle" font-size="10" fill="#a0aec0">
      dramatis.sqlite — copy it and you have copied the project
    </text>
  </g>

  <!-- read arrow back out -->
  <path d="M284 209 L120 209 L120 112" fill="none" stroke="#4a5568" stroke-width="1.4"
        marker-end="url(#arrow)"/>
  <text x="126" y="140" font-size="10" fill="#4a5568">read it in</text>
  <text x="126" y="153" font-size="10" fill="#4a5568">the browser —</text>
  <text x="126" y="166" font-size="10" fill="#4a5568">no model, no</text>
  <text x="126" y="179" font-size="10" fill="#4a5568">network</text>
</svg>

<!-- FIG: the two time axes ------------------------------------------------------------- -->
<svg id="fig-axes" viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <text x="330" y="20" text-anchor="middle" font-size="10.5" fill="#718096"
        letter-spacing="1.2">HOW THE TEXT WAS READ</text>
  <text x="16" y="160" text-anchor="middle" font-size="10.5" fill="#718096" letter-spacing="1.2"
        transform="rotate(-90 16 160)">HOW THE WORK CHANGED</text>

  <!-- column heads -->
  <g text-anchor="middle">
    <text x="270" y="50" font-size="11" fill="#1a202c">Reading A</text>
    <text x="270" y="64" font-size="9" fill="#a0aec0">opus-5 &#183; extract-v1</text>
    <text x="400" y="50" font-size="11" fill="#1a202c">Reading B</text>
    <text x="400" y="64" font-size="9" fill="#a0aec0">opus-5 &#183; extract-v2</text>
    <text x="530" y="50" font-size="11" fill="#1a202c">Reading C</text>
    <text x="530" y="64" font-size="9" fill="#a0aec0">llama3.2 &#183; extract-v2</text>
  </g>

  <!-- row heads -->
  <g text-anchor="end" font-size="11" fill="#1a202c">
    <text x="205" y="112">Draft one</text>
    <text x="205" y="172">Draft two</text>
    <text x="205" y="232">Draft three</text>
  </g>

  <!-- every cell, then the ones that hold a snapshot drawn over them -->
  <g stroke="#e2e8f0" fill="#ffffff">
    <rect x="215" y="88" width="110" height="36" rx="4"/>
    <rect x="345" y="88" width="110" height="36" rx="4"/>
    <rect x="475" y="88" width="110" height="36" rx="4"/>
    <rect x="215" y="148" width="110" height="36" rx="4"/>
    <rect x="345" y="148" width="110" height="36" rx="4"/>
    <rect x="475" y="148" width="110" height="36" rx="4"/>
    <rect x="215" y="208" width="110" height="36" rx="4"/>
    <rect x="345" y="208" width="110" height="36" rx="4"/>
    <rect x="475" y="208" width="110" height="36" rx="4"/>
  </g>

  <g font-size="10" text-anchor="middle">
    <rect x="215" y="88" width="110" height="36" rx="4" fill="#fffaf5" stroke="#c05621"/>
    <text x="270" y="111" fill="#c05621">4c &#183; 4r</text>
    <rect x="345" y="88" width="110" height="36" rx="4" fill="#f7fafc" stroke="#cbd5e0"/>
    <text x="400" y="111" fill="#4a5568">4c &#183; 6r</text>
    <text x="530" y="111" fill="#cbd5e0" font-size="13">&#183;</text>

    <rect x="215" y="148" width="110" height="36" rx="4" fill="#fffaf5" stroke="#c05621"/>
    <text x="270" y="171" fill="#c05621">4c &#183; 4r</text>
    <text x="400" y="171" fill="#cbd5e0" font-size="13">&#183;</text>
    <rect x="475" y="148" width="110" height="36" rx="4" fill="#f7fafc" stroke="#cbd5e0"/>
    <text x="530" y="171" fill="#4a5568">3c &#183; 3r</text>

    <text x="270" y="231" fill="#cbd5e0" font-size="13">&#183;</text>
    <text x="400" y="231" fill="#cbd5e0" font-size="13">&#183;</text>
    <text x="530" y="231" fill="#cbd5e0" font-size="13">&#183;</text>
  </g>

  <!-- the comparable pair: one column, two drafts -->
  <path d="M270 128 L270 144" stroke="#c05621" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="215" y="268" font-size="10" fill="#c05621">
    These two are comparable: the reading was held still, so the difference is the writing.
  </text>
  <text x="215" y="292" font-size="9.5" fill="#a0aec0">
    A dot is a pairing nobody has analysed &#8212; which is not the same as one that found nothing.
  </text>
</svg>

<!-- FIG: the lifecycle ---------------------------------------------------------------- -->
<svg id="fig-lifecycle" viewBox="0 -22 720 152" xmlns="http://www.w3.org/2000/svg"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0aec0"/>
    </marker>
  </defs>

  <g font-size="10.5" text-anchor="middle">
    <circle cx="52" cy="52" r="26" fill="#1a202c"/>
    <text x="52" y="56" fill="#fff" font-size="11">1</text>
    <text x="52" y="98" fill="#1a202c">Install</text>

    <circle cx="163" cy="52" r="26" fill="#4a5568"/>
    <text x="163" y="56" fill="#fff" font-size="11">2</text>
    <text x="163" y="98" fill="#1a202c">Create</text>
    <text x="163" y="111" fill="#718096" font-size="9">a project</text>

    <circle cx="274" cy="52" r="26" fill="#c05621"/>
    <text x="274" y="56" fill="#fff" font-size="11">3</text>
    <text x="274" y="98" fill="#1a202c">Analyse</text>
    <text x="274" y="111" fill="#718096" font-size="9">costs money or time</text>

    <circle cx="385" cy="52" r="26" fill="#4a5568"/>
    <text x="385" y="56" fill="#fff" font-size="11">4</text>
    <text x="385" y="98" fill="#1a202c">Read</text>
    <text x="385" y="111" fill="#718096" font-size="9">free, offline</text>

    <circle cx="496" cy="52" r="26" fill="#4a5568"/>
    <text x="496" y="56" fill="#fff" font-size="11">5</text>
    <text x="496" y="98" fill="#1a202c">Revise</text>
    <text x="496" y="111" fill="#718096" font-size="9">and compare</text>

    <circle cx="607" cy="52" r="26" fill="#2f855a"/>
    <text x="607" y="56" fill="#fff" font-size="11">6</text>
    <text x="607" y="98" fill="#1a202c">Keep</text>
    <text x="607" y="111" fill="#718096" font-size="9">or archive</text>

    <circle cx="690" cy="52" r="18" fill="#e2e8f0"/>
    <text x="690" y="56" fill="#4a5568" font-size="10">7</text>
  </g>

  <g stroke="#a0aec0" stroke-width="1.2" marker-end="url(#arrow2)">
    <line x1="80" y1="52" x2="132" y2="52"/>
    <line x1="191" y1="52" x2="243" y2="52"/>
    <line x1="302" y1="52" x2="354" y2="52"/>
    <line x1="413" y1="52" x2="465" y2="52"/>
    <line x1="524" y1="52" x2="576" y2="52"/>
    <line x1="635" y1="52" x2="667" y2="52"/>
  </g>

  <!-- the loop back -->
  <path d="M496 26 C470 -4, 300 -4, 274 26" fill="none" stroke="#c05621" stroke-width="1.2"
        stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
  <text x="385" y="-8" text-anchor="middle" font-size="9" fill="#c05621">
    steps 3–5 repeat for the life of the work
  </text>
  <text x="690" y="88" text-anchor="middle" font-size="9" fill="#718096">Uninstall</text>
</svg>

<!-- FIG: provenance ------------------------------------------------------------------- -->
<svg id="fig-provenance" viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0aec0"/>

  <g>
    <rect x="10" y="14" width="180" height="52" rx="5" fill="#fff5f0" stroke="#c05621"/>
    <text x="26" y="36" font-size="11.5" fill="#1a202c" font-weight="600">observed</text>
    <text x="26" y="54" font-size="9.5" fill="#718096">the chapters show it happening</text>

    <rect x="10" y="79" width="180" height="52" rx="5" fill="#faf5ff" stroke="#805ad5"/>
    <text x="26" y="101" font-size="11.5" fill="#1a202c" font-weight="600">asserted</text>
    <text x="26" y="119" font-size="9.5" fill="#718096">your notes say it is so</text>

    <rect x="10" y="144" width="180" height="52" rx="5" fill="#f7fafc" stroke="#a0aec0"/>
    <text x="26" y="166" font-size="11.5" fill="#a0aec0" font-weight="600">human</text>

    <text x="26" y="196" font-size="8" fill="#cbd5e0"></text>
  </g>

  <g stroke="#a0aec0" stroke-width="1.2" marker-end="url(#arrow3)">
    <line x1="196" y1="40" x2="256" y2="88"/>
    <line x1="196" y1="105" x2="256" y2="105"/>
    <line x1="196" y1="170" x2="256" y2="122" stroke-dasharray="3 3"/>

  <rect x="262" y="72" width="150" height="66" rx="5" fill="#1a202c"/>
  <text x="337" y="100" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">One graph</text>
  <text x="337" y="119" text-anchor="middle" font-size="9.5" fill="#a0aec0">but three kinds of edge,</text>
  <text x="337" y="130" text-anchor="middle" font-size="9.5" fill="#a0aec0">never merged</text>

  <line x1="418" y1="105" x2="452" y2="105" stroke="#a0aec0" stroke-width="1.2" marker-end="url(#arrow3)"/>

  <g>
    <rect x="458" y="46" width="172" height="118" rx="5" fill="#ffffff" stroke="#e2e8f0"/>

    <text x="474" y="92" font-size="9.5" fill="#805ad5">what did I plan</text>
    <text x="474" y="105" font-size="9.5" fill="#805ad5">and never write?</text>
    <text x="474" y="127" font-size="9.5" fill="#c05621">what did I write</text>
    <text x="474" y="140" font-size="9.5" fill="#c05621">and never plan?</text>
  </g>

  <text x="10" y="207" font-size="8.5" fill="#cbd5e0">Human corrections arrive in a later version of Dramatis; the slot is in the record already.</text>
</svg>
