[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dramatis"
version = "0.1.0.dev0"
description = "Character relationship graphs for narrative works, with snapshots across revisions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Kestora Labs" }]
keywords = ["narrative", "character-network", "digital-humanities", "graph"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # The serve extras belong here too: a development checkout should be able to run every
    # command it ships, not only the ones the tests exercise.
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
anthropic = ["anthropic>=0.40"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
dramatis = "dramatis.cli:main"

[project.urls]
Homepage = "https://github.com/kestora-labs/dramatis"
Source = "https://github.com/kestora-labs/dramatis"

[tool.hatch.build.targets.wheel]
packages = ["src/dramatis"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests are deselected by default and never run in CI: they cost money, need a
# credential, and would make the suite depend on a network. Run them deliberately with
# `pytest -m live` when re-recording cassettes.
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: makes a real, billable provider call. Deselected by default; needs a credential.",
]
